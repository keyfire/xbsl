name: VS Code extension

# Release the extension on vscode-v* tags. A manual run on a branch checks packaging.
# Marketplace uses GitHub OIDC through the keyfire publisher's Trusted Publishing policy.

on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:
    inputs:
      verify_marketplace_oidc:
        description: Verify Marketplace OIDC without publishing
        type: boolean
        default: false

# Один тег - одна публикация: GitHub изредка порождает по событию тега два прогона, и
# второй падает на "уже опубликовано" (ovsx --skip-duplicate этот случай не покрывает).
concurrency:
  group: vscode-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-marketplace-oidc:
    if: github.repository == 'keyfire/xbsl' && github.ref == 'refs/heads/main' && inputs.verify_marketplace_oidc
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Exchange OIDC token with Marketplace
        run: |
          node <<'NODE'
          // This is the same exchange used by vsce publish --oidc in the pinned vsce version.
          const { getOIDCCredential } = require('./node_modules/@vscode/vsce/out/oidc.js');
          const { publisher, name, version } = require('./package.json');
          getOIDCCredential(publisher).then(() => {
            console.log('Marketplace accepted GitHub OIDC for %s (%s@%s).', publisher, name, version);
          }).catch(error => {
            const status = /^(GitHub Actions OIDC token request|Marketplace OIDC token exchange) failed with (\d{3})\b/.exec(error.message);
            console.error(status ? status[1] + ' failed (HTTP ' + status[2] + ').' : 'Marketplace OIDC verification failed.');
            process.exitCode = 1;
          });
          NODE

  publish:
    if: ${{ !inputs.verify_marketplace_oidc }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Package .vsix
        id: package
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$(node -p "require('./package.json').version")"
            if [[ "$GITHUB_REF_NAME" != "vscode-v$version" ]]; then
              printf 'Tag %s does not match extension version %s\n' "$GITHUB_REF_NAME" "$version" >&2
              exit 1
            fi
          fi
          npm run package
      # Тело релиза - раздел версии из CHANGELOG расширения: подписчики видят в ленте
      # "что нового", а не голую ссылку сравнения. Отсутствие раздела публикацию не
      # останавливает - релиз уходит с автогенерированными заметками и предупреждением.
      - name: Тело релиза из CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          python3 ../../scripts/release-notes.py "$version" CHANGELOG.md --out notes.md \
            || { echo "::warning::в CHANGELOG.md расширения нет раздела $version - тело релиза останется автогенерированным"; : > notes.md; }
      - name: GitHub Release (.vsix)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode/xbsl-vscode.vsix
          body_path: editors/vscode/notes.md
          generate_release_notes: true
      - name: Publish to VS Code Marketplace
        if: github.repository == 'keyfire/xbsl' && startsWith(github.ref, 'refs/tags/vscode-v')
        run: npm run publish:vsce
      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.package.outcome == 'success' && startsWith(github.ref, 'refs/tags/vscode-v') && env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:ovsx
