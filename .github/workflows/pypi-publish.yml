# Публикация пакета на PyPI по тегу вида v0.8.1 через Trusted Publishing (OIDC):
# PyPI помечает ссылки проекта проверенными и прикладывает аттестации происхождения.
# Требует одноразовой настройки на стороне PyPI: Manage project -> Publishing ->
# Add GitHub publisher (owner, repo, workflow pypi-publish.yml, environment pypi).
# Теги расширения vscode-v* этот workflow не трогает.
name: pypi-publish

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install "git+https://github.com/keyfire/docsguard@main"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      # Job test ставит пакет editable: там на sys.path лежит рабочий каталог целиком, и
      # подпакет, не дописанный в [tool.setuptools] packages, импортируется как ни в чём не
      # бывало. В колесе его нет – расхождение видно только на самом артефакте, поэтому
      # ставим собранное колесо в отдельное чистое окружение и поднимаем то, ради чего пакет
      # ставят: подпакеты, точку входа CLI и реестр правил.
      - name: Проверить собранное колесо
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          # Проверка идёт из /tmp, а не из каталога сборки: `python -c` кладёт текущий
          # каталог в sys.path, а там лежат исходники xbsl – импорт достал бы их и снова
          # показал бы подпакет, которого в колесе нет.
          cd /tmp
          /tmp/wheelcheck/bin/python -c "import xbsl.translation, xbsl.cli, xbsl.engine, xbsl.rules; assert xbsl.engine.RULES, 'rule registry is empty'; print('rules:', len(xbsl.engine.RULES))"
          /tmp/wheelcheck/bin/xbsl --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Нативные колёса (mypyc-скомпилированные лексер и парсер) под три платформы.
  # Пользователю компилятор не нужен: pip выбирает готовое колесо своей платформы,
  # для остальных остаётся универсальное py3-none-any из job build (чистый Python).
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.1
        env:
          XBSL_MYPYC: "1"
          # Linux собирается в docker-контейнере - env туда пробрасывает CIBW_ENVIRONMENT.
          CIBW_ENVIRONMENT: 'XBSL_MYPYC="1"'
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # PEP 517-изоляция прячет установленный mypy от сборки - собираем без неё.
          CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
          CIBW_BEFORE_BUILD: "pip install mypy setuptools wheel"
          # Дым-тест без данных Элемента: модули импортируются и они нативные
          # (полный разбор требует language.json - его в тестовом окружении нет).
          # Реестр правил и подпакет translation проверяются здесь же: колесо ставится из
          # артефакта, поэтому пропуск в [tool.setuptools] packages виден сразу, а не у
          # пользователя после публикации.
          CIBW_TEST_COMMAND: >-
            python -c "import xbsl.lexer, xbsl.parser, xbsl.engine, xbsl.rules, xbsl.translation;
            assert not xbsl.lexer.__file__.endswith('.py'), xbsl.lexer.__file__;
            assert not xbsl.parser.__file__.endswith('.py'), xbsl.parser.__file__;
            assert xbsl.engine.RULES, 'rule registry is empty'"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [build, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Карточка релиза на GitHub: подписчики репозитория видят в ленте "что нового" из
  # CHANGELOG. Только после успешной публикации - релиз объявляет то, что уже на PyPI.
  # Отсутствие раздела карточку не отменяет: тело останется автогенерированным.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Тело релиза из CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release-notes.py "$version" CHANGELOG.md --out notes.md \
            || { echo "::warning::в CHANGELOG.md нет раздела $version - тело релиза останется автогенерированным"; : > notes.md; }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
