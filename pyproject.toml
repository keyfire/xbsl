[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xbsl"
# Единственный источник версии – xbsl/__init__.py (__version__): её печатают CLI, LSP и
# статус-бар расширения. Раньше версия дублировалась здесь, разъехалась при бампах, и
# пакеты 0.20/0.21 представлялись как 0.19.0.
dynamic = ["version"]
description = "The XBSL (1C:Element) toolkit: a linter with autofixes, LSP, MCP server, documentation search, project index, metadata scaffolding, translation into English spellings, and a VS Code extension"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xbsl contributors" }]
keywords = ["1c", "1c-element", "xbsl", "linter", "lsp", "mcp", "scaffolding", "translation", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/keyfire/xbsl"
Repository = "https://github.com/keyfire/xbsl"
Issues = "https://github.com/keyfire/xbsl/issues"
Changelog = "https://github.com/keyfire/xbsl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# setuptools здесь ради теста упаковки: он сверяет список packages с деревом через
# find_packages. Сборочная зависимость из [build-system] живёт в изолированном окружении
# сборки, в окружении тестов её может не быть – и сторож молча пропускался бы.
dev = ["pytest>=7", "pymorphy3>=2.0", "setuptools>=77"]
mcp = ["mcp>=1.2,<3"]
lsp = ["pygls>=1.3,<2"]
# Морфология русского языка: правило naming/number (справочники во множественном числе,
# перечисления в единственном) без неё молчит - гадать по окончаниям нельзя.
morph = ["pymorphy3>=2.0"]

[project.scripts]
xbsl = "xbsl.cli:main"
xbsl-mcp = "xbsl.mcp_server:main"
xbsl-web = "xbsl.web:main"
xbsl-lsp = "xbsl.lsp:main"
# Команды под старым именем пакета остаются псевдонимами на переходный период.
xbsllint = "xbsl.cli:main"
xbsllint-mcp = "xbsl.mcp_server:main"
xbsllint-web = "xbsl.web:main"
xbsllint-lsp = "xbsl.lsp:main"

[tool.setuptools]
# xbsllint – пакет-псевдоним: импорт xbsllint/xbsllint.X отдаёт модули xbsl (см. его __init__).
# Список явный, поэтому каждый новый подпакет дописывается сюда руками: не дописанный в колесо
# не попадёт, а в разработке этого не видно – editable-установка показывает дерево целиком.
# Сверку списка с деревом держит tests/test_packaging.py.
packages = ["xbsl", "xbsl.extract", "xbsl.rules", "xbsl.translation", "xbsl.translation.machine", "xbsllint"]

[tool.setuptools.dynamic]
version = {attr = "xbsl.__version__"}

[tool.setuptools.package-data]
xbsl = ["data/element/index.json", "data/element/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
