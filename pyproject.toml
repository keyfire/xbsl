[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xbsl"
# Единственный источник версии – xbsl/__init__.py (__version__): её печатают CLI, LSP и
# статус-бар расширения. Раньше версия дублировалась здесь, разъехалась при бампах, и
# пакеты 0.20/0.21 представлялись как 0.19.0.
dynamic = ["version"]
description = "The XBSL (1C:Element) toolkit: a linter with autofixes, LSP, MCP server, documentation search, project index, metadata scaffolding, translation into English spellings, and a VS Code extension"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xbsl contributors" }]
keywords = ["1c", "1c-element", "xbsl", "linter", "lsp", "mcp", "scaffolding", "translation", "static-analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/keyfire/xbsl"
Repository = "https://github.com/keyfire/xbsl"
Issues = "https://github.com/keyfire/xbsl/issues"
Changelog = "https://github.com/keyfire/xbsl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# setuptools здесь ради теста упаковки: он сверяет список packages с деревом через
# find_packages. Сборочная зависимость из [build-system] живёт в изолированном окружении
# сборки, в окружении тестов её может не быть – и сторож молча пропускался бы.
# The documentation guard is installed by the checks themselves, not declared here:
# PyPI refuses a distribution whose metadata carries a direct URL dependency, even
# in an optional extra. See the CI workflow and CONTRIBUTING.
dev = ["pytest>=7", "pymorphy3>=2.0", "setuptools>=77"]
mcp = ["mcp>=1.2,<3"]
lsp = ["pygls>=1.3,<2"]
# Морфология русского языка: правило naming/number (справочники во множественном числе,
# перечисления в единственном) без неё молчит - гадать по окончаниям нельзя.
morph = ["pymorphy3>=2.0"]

[project.scripts]
xbsl = "xbsl.cli:main"
# The MCP server behind a supervisor that replaces it when the engine on disk changes
# (xbsl/mcp_supervisor.py); `--no-supervisor` runs the bare server in the same process. The
# entry is the supervisor's module because importing xbsl.mcp_server loads the engine, and the
# supervisor must not hold one. `python -m xbsl.mcp_server` stays the bare server - the worker.
xbsl-mcp = "xbsl.mcp_supervisor:main"
xbsl-mcp-supervisor = "xbsl.mcp_supervisor:main"
xbsl-web = "xbsl.web:main"
xbsl-lsp = "xbsl.lsp:main"
[tool.setuptools]
# The explicit package list must include every subpackage distributed by the wheel.
# tests/test_packaging.py compares it with the source tree.
packages = ["xbsl", "xbsl.extract", "xbsl.rules", "xbsl.translation", "xbsl.translation.machine"]

[tool.setuptools.dynamic]
version = {attr = "xbsl.__version__"}

[tool.setuptools.package-data]
xbsl = ["data/element/index.json", "data/element/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
