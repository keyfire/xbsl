<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Искра между фигурными скобками: код и огонь одним знаком.
       Пламя нарисовано симметрично относительно оси x=0, а его габарит по вертикали
       (-104..+60) сдвинут вниз на 22 - иначе оптический центр знака уезжает вверх,
       и в круглой маске это читается как перекос. -->
  <defs>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#e8590c"/>
      <stop offset="0.45" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="core" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#fff8e1"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="1" stop-color="#11141c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256)">
    <!-- Скобки: путь идёт сверху вниз на 168 единиц, поэтому начинается с -84 - тогда его
         середина попадает в 0. С прежним -118 скобки сидели выше центра, а пламя ниже, и
         знак выглядел разъехавшимся. -->
    <g fill="none" stroke="#eef1f8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-96,-84 c-28,0 -28,32 -28,52 c0,22 -13,32 -25,32 c12,0 25,10 25,32 c0,20 0,52 28,52"/>
      <path d="M96,-84 c28,0 28,32 28,52 c0,22 13,32 25,32 c-12,0 -25,10 -25,32 c0,20 0,52 -28,52"/>
    </g>
    <!-- Пламя: несимметричная форма с загибом - живее ровной капли. Её габарит по вертикали
         -96..+80, поэтому группа сдвинута на 8 вниз: так середина знака попадает в центр. -->
    <g transform="translate(0 8)">
      <path d="M6,-96
               c44,40 62,72 62,104
               c0,42 -30,72 -68,72 c-38,0 -68,-28 -68,-68
               c0,-26 12,-48 30,-66 c-2,22 8,36 24,38
               c-14,-38 -6,-64 20,-80 Z" fill="url(#flame)"/>
      <path d="M2,-14 c18,18 26,32 26,48 c0,18 -12,30 -28,30 c-16,0 -28,-12 -28,-28
               c0,-16 12,-32 30,-50 Z" fill="url(#core)"/>
    </g>
  </g>
</svg>
