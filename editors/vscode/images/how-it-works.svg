<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660">
  <!-- The colours live in variables so the picture follows the reader's theme: the light
       palette is the default, the dark one comes from the media query. It works even when the
       file is embedded as <img> - the SVG document gets the system preference of its own.
       The PNG next to it is rendered from this file with the dark palette forced, because a
       README cannot carry an SVG (vsce refuses to package one). -->
  <style>
    :root {
      --card: #ffffff;
      --card-edge: #d0d7e2;
      --zone: #f4f6fa;
      --zone-edge: #d7dde8;
      --box: #ffffff;
      --box-edge: #ccd4e0;
      --title: #1c2029;
      --muted: #5c6577;
      --body: #414a5c;
      --code: #2b3346;
      --code-dim: #67707f;
      --edge-text: #3c4557;
      --edge: #8a94a6;
      --accent-blue: #0969da;
      --accent-orange: #bc4c00;
      --accent-green: #1a7f37;
      --accent-purple: #8250df;
      --accent-teal: #0b7285;
      --accent-pink: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #14171e;
        --card-edge: #262c38;
        --zone: #181c26;
        --zone-edge: #2c3345;
        --box: #232a38;
        --box-edge: #3b445c;
        --title: #eef1f8;
        --muted: #7f8aa3;
        --body: #aab3c7;
        --code: #c9d4ea;
        --code-dim: #8b95ab;
        --edge-text: #c6cddd;
        --edge: #6d7891;
        --accent-blue: #3794ff;
        --accent-orange: #f0883e;
        --accent-green: #56d364;
        --accent-purple: #a78bfa;
        --accent-teal: #39c5cf;
        --accent-pink: #f778ba;
      }
    }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Cascadia Mono', Menlo, monospace; }
    .zone-label { font-size: 11.5px; font-weight: 600; letter-spacing: 1.5px; fill: var(--muted); }
    .box-title { font-size: 15px; font-weight: 600; fill: var(--title); }
    .box-sub { font-size: 12px; fill: var(--muted); }
    .box-body { font-size: 12.5px; fill: var(--body); }
    .code { font-size: 11.5px; fill: var(--code); }
    .code-dim { font-size: 11.5px; fill: var(--code-dim); }
    .edge-label { font-size: 12.5px; font-weight: 600; fill: var(--edge-text); }
    .edge-sub { font-size: 11.5px; font-style: italic; fill: var(--code-dim); }
    .box { fill: var(--box); stroke: var(--box-edge); }
    .edge { stroke: var(--edge); stroke-width: 1.5; fill: none; }
    .arrow { fill: var(--edge); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="819" height="659" rx="12" fill="var(--card)" stroke="var(--card-edge)"/>

  <!-- zones -->
  <rect x="14" y="30" width="232" height="616" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <rect x="262" y="30" width="280" height="616" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <rect x="558" y="30" width="248" height="616" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <text x="30" y="54" class="zone-label">VS CODE</text>
  <text x="278" y="54" class="zone-label">XBSL ENGINE</text>
  <text x="574" y="54" class="zone-label">PROJECT</text>

  <!-- feature bus -->
  <line x1="252" y1="110" x2="252" y2="410" class="edge"/>
  <line x1="230" y1="110" x2="252" y2="110" class="edge"/>
  <line x1="230" y1="210" x2="252" y2="210" class="edge"/>
  <line x1="230" y1="310" x2="252" y2="310" class="edge"/>
  <line x1="230" y1="410" x2="252" y2="410" class="edge"/>

  <!-- edges -->
  <line x1="252" y1="158" x2="278" y2="158" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="252" y1="340" x2="278" y2="340" class="edge" stroke-dasharray="5 4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="526" y1="165" x2="574" y2="165" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="550" y="152" text-anchor="middle" class="edge-sub">reads</text>

  <!-- Diagnostics -->
  <rect x="30" y="68" width="200" height="84" rx="8" class="box"/>
  <rect x="30" y="76" width="3" height="68" rx="1.5" fill="var(--accent-blue)"/>
  <text x="44" y="92" class="box-title">Diagnostics</text>
  <text x="44" y="114" class="box-body">as you type; the whole</text>
  <text x="44" y="132" class="box-body">project on save + quick fixes</text>

  <!-- Metadata tree -->
  <rect x="30" y="168" width="200" height="84" rx="8" class="box"/>
  <rect x="30" y="176" width="3" height="68" rx="1.5" fill="var(--accent-pink)"/>
  <text x="44" y="192" class="box-title">Metadata tree</text>
  <text x="44" y="214" class="box-body">creates objects, fields,</text>
  <text x="44" y="232" class="box-body">forms via the engine</text>

  <!-- Form preview -->
  <rect x="30" y="268" width="200" height="84" rx="8" class="box"/>
  <rect x="30" y="276" width="3" height="68" rx="1.5" fill="var(--accent-green)"/>
  <text x="44" y="292" class="box-title">Form preview</text>
  <text x="44" y="314" class="box-body">a form wireframe</text>
  <text x="44" y="332" class="box-body">+ the properties panel</text>

  <!-- Docs panel -->
  <rect x="30" y="368" width="200" height="84" rx="8" class="box"/>
  <rect x="30" y="376" width="3" height="68" rx="1.5" fill="var(--accent-purple)"/>
  <text x="44" y="392" class="box-title">Docs panel</text>
  <text x="44" y="414" class="box-body">the Element reference</text>
  <text x="44" y="432" class="box-body">for the symbol at cursor</text>

  <!-- LSP server -->
  <rect x="278" y="68" width="248" height="180" rx="8" class="box"/>
  <rect x="278" y="76" width="3" height="164" rx="1.5" fill="var(--accent-orange)"/>
  <text x="292" y="92" class="box-title">xbsl-lsp</text>
  <text x="292" y="110" class="box-sub">(long-living server, stdio)</text>
  <text x="292" y="136" class="box-body">per-file lint while typing,</text>
  <text x="292" y="154" class="box-body">project lint on save, index:</text>
  <text x="292" y="172" class="box-body">definition, completion, hover</text>
  <text x="292" y="198" class="mono code">xbsl/docs* · xbsl/meta*</text>
  <text x="292" y="222" class="mono code-dim">pip install "xbsl[lsp]"</text>

  <!-- CLI fallback -->
  <rect x="278" y="286" width="248" height="110" rx="8" fill="var(--box)" stroke="var(--box-edge)" stroke-dasharray="5 4"/>
  <rect x="278" y="294" width="3" height="94" rx="1.5" fill="var(--accent-teal)"/>
  <text x="292" y="310" class="box-title">CLI mode</text>
  <text x="292" y="334" class="mono code">xbsl --stdin · --dry-run</text>
  <text x="292" y="358" class="box-body">the same checks and scaffolding</text>
  <text x="292" y="376" class="box-body">when the server is unavailable</text>

  <!-- footnote -->
  <text x="402" y="444" text-anchor="middle" class="box-sub">scaffolding returns full file texts –</text>
  <text x="402" y="462" text-anchor="middle" class="box-sub">the extension applies them as one</text>
  <text x="402" y="480" text-anchor="middle" class="box-sub">undoable WorkspaceEdit</text>

  <!-- Sources -->
  <rect x="574" y="110" width="216" height="118" rx="8" class="box"/>
  <rect x="574" y="118" width="3" height="102" rx="1.5" fill="var(--accent-green)"/>
  <text x="588" y="134" class="box-title">Sources</text>
  <text x="588" y="160" class="mono code">Имя.yaml · Имя.xbsl</text>
  <text x="588" y="184" class="box-body">pairs: element description</text>
  <text x="588" y="202" class="box-body">+ code module</text>

  <!-- Baseline -->
  <rect x="574" y="330" width="216" height="112" rx="8" class="box"/>
  <rect x="574" y="338" width="3" height="96" rx="1.5" fill="var(--muted)"/>
  <text x="588" y="354" class="box-title">Baseline</text>
  <text x="588" y="378" class="mono code">.xbsllint-baseline</text>
  <text x="588" y="400" class="box-body">excluded findings,</text>
  <text x="588" y="418" class="box-body">honored by every run</text>

  <!-- Deploy and debugging: they call elemctl, not the engine -->
  <rect x="30" y="462" width="200" height="76" rx="8" class="box"/>
  <rect x="30" y="470" width="3" height="60" rx="1.5" fill="var(--accent-teal)"/>
  <text x="44" y="486" class="box-title">Deploy</text>
  <text x="44" y="506" class="mono code">elemctl deploy</text>
  <text x="44" y="526" class="box-body">apply, verified honestly</text>

  <rect x="30" y="554" width="200" height="76" rx="8" class="box"/>
  <rect x="30" y="562" width="3" height="60" rx="1.5" fill="var(--accent-orange)"/>
  <text x="44" y="578" class="box-title">Debugging</text>
  <text x="44" y="598" class="mono code">elemctl apps debug</text>
  <text x="44" y="618" class="box-body">adapter, breakpoints</text>

  <path d="M230,500 H250 V592 H230" class="edge" stroke-dasharray="4 4"/>
  <text x="286" y="540" class="edge-sub">these two go through</text>
  <text x="286" y="558" class="edge-sub">elemctl, not the engine</text>
</svg>
