<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700">
  <!-- The colours live in variables so the picture follows the reader's theme: the light
       palette is the default, the dark one comes from the media query. It works even when the
       file is embedded as <img> - the SVG document gets the system preference of its own.
       The PNG next to it is rendered from this file with the dark palette forced, because a
       README cannot carry an SVG (vsce refuses to package one). -->
  <style>
    :root {
      --card: #ffffff; --card-edge: #d0d7e2;
      --zone: #f4f6fa; --zone-edge: #d7dde8;
      --box: #ffffff; --box-edge: #ccd4e0;
      --title: #1c2029; --muted: #5c6577; --body: #414a5c;
      --code: #2b3346; --code-dim: #67707f;
      --edge-text: #3c4557; --edge: #8a94a6;
      --accent-blue: #0969da; --accent-orange: #bc4c00; --accent-green: #1a7f37;
      --accent-purple: #8250df; --accent-teal: #0b7285; --accent-pink: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #14171e; --card-edge: #262c38;
        --zone: #181c26; --zone-edge: #2c3345;
        --box: #232a38; --box-edge: #3b445c;
        --title: #eef1f8; --muted: #7f8aa3; --body: #aab3c7;
        --code: #c9d4ea; --code-dim: #8b95ab;
        --edge-text: #c6cddd; --edge: #6d7891;
        --accent-blue: #3794ff; --accent-orange: #f0883e; --accent-green: #56d364;
        --accent-purple: #a78bfa; --accent-teal: #39c5cf; --accent-pink: #f778ba;
      }
    }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Cascadia Mono', Menlo, monospace; }
    .zone-label { font-size: 11.5px; font-weight: 600; letter-spacing: 1.5px; fill: var(--muted); }
    .box-title { font-size: 15px; font-weight: 600; fill: var(--title); }
    .box-sub { font-size: 12px; fill: var(--muted); }
    .box-body { font-size: 12.5px; fill: var(--body); }
    .code { font-size: 11.5px; fill: var(--code); }
    .code-dim { font-size: 11.5px; fill: var(--code-dim); }
    .edge-sub { font-size: 11.5px; font-style: italic; fill: var(--code-dim); }
    .box { fill: var(--box); stroke: var(--box-edge); }
    .edge { stroke: var(--edge); stroke-width: 1.5; fill: none; }
    .arrow { fill: var(--edge); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="699" rx="12" fill="var(--card)" stroke="var(--card-edge)"/>

  <!-- zones: the editor spans both rows, the engine and the project sit above elemctl and the stand -->
  <rect x="14" y="30" width="248" height="656" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <rect x="278" y="30" width="286" height="400" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <rect x="580" y="30" width="286" height="400" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <rect x="278" y="446" width="286" height="240" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <rect x="580" y="446" width="286" height="240" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <text x="30" y="54" class="zone-label">VS CODE</text>
  <text x="294" y="54" class="zone-label">XBSL ENGINE</text>
  <text x="596" y="54" class="zone-label">PROJECT</text>
  <text x="294" y="470" class="zone-label">ELEMCTL</text>
  <text x="596" y="470" class="zone-label">PLATFORM STAND</text>

  <!-- the four features that talk to the engine -->
  <rect x="30" y="68" width="216" height="76" rx="8" class="box"/>
  <rect x="30" y="76" width="3" height="60" rx="1.5" fill="var(--accent-blue)"/>
  <text x="44" y="90" class="box-title">Diagnostics</text>
  <text x="44" y="110" class="box-body">as you type; the whole project</text>
  <text x="44" y="128" class="box-body">on save + quick fixes</text>

  <rect x="30" y="158" width="216" height="76" rx="8" class="box"/>
  <rect x="30" y="166" width="3" height="60" rx="1.5" fill="var(--accent-pink)"/>
  <text x="44" y="180" class="box-title">Metadata tree</text>
  <text x="44" y="200" class="box-body">creates objects, attributes,</text>
  <text x="44" y="218" class="box-body">forms through the engine</text>

  <rect x="30" y="248" width="216" height="76" rx="8" class="box"/>
  <rect x="30" y="256" width="3" height="60" rx="1.5" fill="var(--accent-green)"/>
  <text x="44" y="270" class="box-title">Form preview</text>
  <text x="44" y="290" class="box-body">the form frame</text>
  <text x="44" y="308" class="box-body">+ the properties panel</text>

  <rect x="30" y="338" width="216" height="76" rx="8" class="box"/>
  <rect x="30" y="346" width="3" height="60" rx="1.5" fill="var(--accent-purple)"/>
  <text x="44" y="360" class="box-title">Documentation panel</text>
  <text x="44" y="380" class="box-body">the platform reference</text>
  <text x="44" y="398" class="box-body">for the symbol at the cursor</text>

  <!-- the two that go to elemctl -->
  <rect x="30" y="470" width="216" height="76" rx="8" class="box"/>
  <rect x="30" y="478" width="3" height="60" rx="1.5" fill="var(--accent-teal)"/>
  <text x="44" y="492" class="box-title">Deploy</text>
  <text x="44" y="512" class="mono code">elemctl deploy</text>
  <text x="44" y="530" class="box-body">with the apply verified</text>

  <rect x="30" y="562" width="216" height="76" rx="8" class="box"/>
  <rect x="30" y="570" width="3" height="60" rx="1.5" fill="var(--accent-orange)"/>
  <text x="44" y="584" class="box-title">Debugging</text>
  <text x="44" y="604" class="mono code">elemctl apps debug</text>
  <text x="44" y="622" class="box-body">breakpoints, call stack</text>

  <!-- editor to engine -->
  <line x1="262" y1="240" x2="278" y2="240" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <!-- editor to elemctl -->
  <line x1="262" y1="508" x2="278" y2="508" class="edge" marker-end="url(#ah)"/>
  <line x1="262" y1="600" x2="278" y2="600" class="edge" marker-end="url(#ah)"/>

  <!-- engine -->
  <rect x="294" y="72" width="254" height="176" rx="8" class="box"/>
  <rect x="294" y="80" width="3" height="160" rx="1.5" fill="var(--accent-orange)"/>
  <text x="308" y="96" class="box-title">xbsl-lsp</text>
  <text x="308" y="114" class="box-sub">(long-living server, stdio)</text>
  <text x="308" y="140" class="box-body">per-file lint as you type,</text>
  <text x="308" y="158" class="box-body">project-wide on save, the index:</text>
  <text x="308" y="176" class="box-body">definitions, completion, hover</text>
  <text x="308" y="202" class="mono code">xbsl/docs* · xbsl/meta*</text>
  <text x="308" y="226" class="mono code-dim">pip install "xbsl[lsp]"</text>

  <rect x="294" y="282" width="254" height="98" rx="8" fill="var(--box)" stroke="var(--box-edge)" stroke-dasharray="5 4"/>
  <rect x="294" y="290" width="3" height="82" rx="1.5" fill="var(--accent-teal)"/>
  <text x="308" y="306" class="box-title">CLI mode</text>
  <text x="308" y="330" class="mono code">xbsl --stdin · --dry-run</text>
  <text x="308" y="352" class="box-body">the same checks and scaffolding</text>
  <text x="308" y="370" class="box-body">without the server</text>

  <!-- engine reads the project -->
  <line x1="548" y1="160" x2="596" y2="160" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="572" y="148" text-anchor="middle" class="edge-sub">reads</text>

  <!-- project -->
  <rect x="596" y="88" width="254" height="112" rx="8" class="box"/>
  <rect x="596" y="96" width="3" height="96" rx="1.5" fill="var(--accent-green)"/>
  <text x="610" y="112" class="box-title">Sources</text>
  <text x="610" y="136" class="mono code">Name.yaml · Name.xbsl</text>
  <text x="610" y="158" class="box-body">pairs: the element description</text>
  <text x="610" y="176" class="box-body">+ the code module</text>

  <rect x="596" y="240" width="254" height="112" rx="8" class="box"/>
  <rect x="596" y="248" width="3" height="96" rx="1.5" fill="var(--muted)"/>
  <text x="610" y="264" class="box-title">Baseline</text>
  <text x="610" y="288" class="mono code">.xbsllint-baseline</text>
  <text x="610" y="310" class="box-body">excluded findings,</text>
  <text x="610" y="328" class="box-body">honored by every run</text>

  <!-- elemctl -->
  <rect x="294" y="490" width="254" height="176" rx="8" class="box"/>
  <rect x="294" y="498" width="3" height="160" rx="1.5" fill="var(--accent-teal)"/>
  <text x="308" y="514" class="box-title">elemctl</text>
  <text x="308" y="538" class="mono code">deploy</text>
  <text x="308" y="558" class="box-body">build → upload → apply</text>
  <text x="308" y="576" class="box-body">and an honest check that</text>
  <text x="308" y="594" class="box-body">the apply took effect</text>
  <text x="308" y="620" class="mono code">apps debug</text>
  <text x="308" y="640" class="box-body">the debug session coordinates</text>

  <!-- elemctl to the stand: the arrows carry no captions on purpose - the gap between the zones
       is 48px wide, and a caption there ran over the neighbouring box. What each arrow means is
       written inside the boxes it connects. -->
  <line x1="548" y1="546" x2="596" y2="546" class="edge" marker-end="url(#ah)"/>
  <line x1="548" y1="620" x2="596" y2="620" class="edge" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- the running application -->
  <rect x="596" y="500" width="254" height="150" rx="8" class="box"/>
  <rect x="596" y="508" width="3" height="134" rx="1.5" fill="var(--accent-blue)"/>
  <text x="610" y="524" class="box-title">Application</text>
  <text x="610" y="548" class="box-body">the client in a browser</text>
  <text x="610" y="566" class="box-body">and the server side</text>
  <text x="610" y="596" class="mono code-dim">?debug-session-id=...</text>
  <text x="610" y="620" class="box-body">the debugger joins by sessionId</text>
</svg>
