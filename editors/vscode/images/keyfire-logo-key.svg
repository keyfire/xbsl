<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Вариант B: ключ, чья бородка - язык пламени. Имя читается буквально. -->
  <defs>
    <linearGradient id="flame" x1="0.2" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#e8590c"/>
      <stop offset="0.5" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="1" stop-color="#11141c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 262)">
    <!-- кольцо ключа -->
    <circle cx="-92" cy="0" r="66" fill="none" stroke="#eef1f8" stroke-width="30"/>
    <circle cx="-92" cy="0" r="20" fill="#11141c"/>
    <!-- стержень -->
    <rect x="-30" y="-15" width="150" height="30" rx="8" fill="#eef1f8"/>
    <!-- зубцы -->
    <rect x="36" y="15" width="26" height="42" rx="7" fill="#eef1f8"/>
    <rect x="86" y="15" width="26" height="30" rx="7" fill="#eef1f8"/>
    <!-- пламя на конце -->
    <path d="M120,-15
             c34,-26 22,-58 8,-74 c40,18 66,52 66,86
             c0,36 -30,62 -66,62 c-14,0 -26,-4 -36,-10
             c30,-4 50,-24 50,-48 c0,-8 -6,-14 -22,-16 Z"
          fill="url(#flame)"/>
  </g>
</svg>
