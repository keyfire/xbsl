      <path d="M-78,-2 L-2,-108 h44 L-34,0 L42,108 H-2 Z"/>
    </g>
    <!-- F, пламенем -->
    <g fill="url(#flame)">
      <rect x="58" y="-108" width="34" height="216" rx="6"/>
      <rect x="58" y="-108" width="104" height="32" rx="6"/>
      <rect x="58" y="-16" width="82" height="30" rx="6"/>
    </g>
