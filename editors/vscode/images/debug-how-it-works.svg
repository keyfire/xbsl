<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560">
  <!-- The colours live in variables so the picture follows the reader's theme: the light
       palette is the default, the dark one comes from the media query. It works even when the
       file is embedded as <img> - the SVG document gets the system preference of its own.
       The PNG next to it is rendered from this file with the dark palette forced, because a
       README cannot carry an SVG (vsce refuses to package one). -->
  <style>
    :root {
      --card: #ffffff;        --card-edge: #d0d7e2;
      --zone: #f4f6fa;        --zone-edge: #d7dde8;
      --box: #ffffff;         --box-edge: #ccd4e0;
      --panel: #f6f8fc;       --panel-edge: #dde3ec;
      --title: #1c2029;       --muted: #5c6577;   --body: #414a5c;
      --code: #2b3346;        --code-dim: #67707f;
      --edge: #8a94a6;        --edge-text: #3c4557;
      --accent-editor: #0969da; --accent-adapter: #bc4c00; --accent-cli: #bf8700;
      --accent-browser: #1a7f37; --accent-server: #8250df; --accent-api: #0b7285;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #14171e;      --card-edge: #262c38;
        --zone: #181c26;      --zone-edge: #2c3345;
        --box: #232a38;       --box-edge: #3b445c;
        --panel: #1a1f2a;     --panel-edge: #2d3444;
        --title: #eef1f8;     --muted: #7f8aa3;   --body: #aab3c7;
        --code: #c9d4ea;      --code-dim: #8b95ab;
        --edge: #6d7891;      --edge-text: #c6cddd;
        --accent-editor: #3794ff; --accent-adapter: #f0883e; --accent-cli: #ffd23f;
        --accent-browser: #56d364; --accent-server: #a78bfa; --accent-api: #39c5cf;
      }
    }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Cascadia Mono', Menlo, monospace; }
    .zone-label { font-size: 11.5px; font-weight: 600; letter-spacing: 1.5px; fill: var(--muted); }
    .box-title { font-size: 15px; font-weight: 600; fill: var(--title); }
    .box-sub { font-size: 12px; fill: var(--muted); }
    .box-body { font-size: 12.5px; fill: var(--body); }
    .code { font-size: 11.5px; fill: var(--code); }
    .code-dim { font-size: 11.5px; fill: var(--code-dim); }
    .edge-label { font-size: 12.5px; font-weight: 600; fill: var(--edge-text); }
    .edge-sub { font-size: 11.5px; font-style: italic; fill: var(--code-dim); }
    .box { fill: var(--box); stroke: var(--box-edge); }
    .edge { stroke: var(--edge); stroke-width: 1.5; fill: none; }
    .arrow { fill: var(--edge); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="819" height="559" rx="12" fill="var(--card)" stroke="var(--card-edge)"/>

  <!-- zones -->
  <rect x="14" y="30" width="520" height="516" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <rect x="550" y="30" width="256" height="516" rx="10" fill="var(--zone)" stroke="var(--zone-edge)" stroke-dasharray="5 4"/>
  <text x="30" y="54" class="zone-label">DEVELOPER MACHINE</text>
  <text x="566" y="54" class="zone-label">1C:ELEMENT CLOUD</text>

  <!-- edges -->
  <line x1="254" y1="110" x2="330" y2="110" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="292" y="98" text-anchor="middle" class="edge-label">DAP (stdio)</text>
  <text x="292" y="128" text-anchor="middle" class="edge-sub">spawns</text>

  <line x1="143" y1="248" x2="143" y2="292" class="edge" marker-end="url(#ah)"/>
  <text x="153" y="274" class="edge-sub">runs</text>

  <line x1="254" y1="332" x2="562" y2="332" class="edge" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="411" y="352" text-anchor="middle" class="mono code">debug-address, debug-token</text>

  <path d="M522,110 H671 V172" class="edge" marker-end="url(#ah)"/>
  <text x="612" y="98" text-anchor="middle" class="edge-label">WebSocket</text>
  <text x="612" y="126" text-anchor="middle" class="mono code">debug-address, debug-token</text>

  <path d="M254,220 H292 V452" class="edge" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="300" y="414" class="edge-sub">opens on start</text>

  <path d="M518,489 H790 V204 H778" class="edge" marker-end="url(#ah)"/>
  <text x="654" y="477" text-anchor="middle" class="mono code">same sessionId</text>

  <!-- VS Code -->
  <rect x="32" y="68" width="222" height="180" rx="8" class="box"/>
  <rect x="32" y="76" width="3" height="164" rx="1.5" fill="var(--accent-editor)"/>
  <text x="46" y="94" class="box-title">VS Code</text>
  <text x="46" y="112" class="box-sub">(the XBSL extension)</text>
  <text x="46" y="137" class="box-body">editor, breakpoints,</text>
  <text x="46" y="155" class="box-body">Variables / Watch</text>
  <rect x="44" y="168" width="198" height="64" rx="6" fill="var(--panel)" stroke="var(--panel-edge)"/>
  <text x="54" y="186" class="mono code">xbsl.debug.adapterPath</text>
  <text x="54" y="202" class="mono code">xbsl.debug.javaPath</text>
  <text x="54" y="218" class="mono code">xbsl.deploy.elemctlPath</text>

  <!-- Java debug adapter -->
  <rect x="330" y="68" width="192" height="92" rx="8" class="box"/>
  <rect x="330" y="76" width="3" height="76" rx="1.5" fill="var(--accent-adapter)"/>
  <text x="344" y="94" class="box-title">Java debug adapter</text>
  <text x="344" y="118" class="box-body">from the platform</text>
  <text x="344" y="136" class="box-body">distribution</text>
  <text x="426" y="180" text-anchor="middle" class="mono code-dim">java -cp &lt;adapterPath&gt;/repo/*</text>

  <!-- elemctl -->
  <rect x="32" y="296" width="222" height="100" rx="8" class="box"/>
  <rect x="32" y="304" width="3" height="84" rx="1.5" fill="var(--accent-cli)"/>
  <text x="46" y="320" class="box-title">elemctl</text>
  <text x="46" y="340" class="mono code">apps debug / apps get</text>
  <text x="46" y="361" class="box-body">reads .env in the sources root</text>
  <text x="46" y="380" class="mono code-dim">(ELEMENT_* credentials, app id)</text>

  <!-- Browser -->
  <rect x="32" y="456" width="486" height="66" rx="8" class="box"/>
  <rect x="32" y="464" width="3" height="50" rx="1.5" fill="var(--accent-browser)"/>
  <text x="46" y="482" class="box-title">Browser – the application under debug</text>
  <text x="46" y="506" class="mono code">&lt;app-uri&gt;?debug-server-host=...&amp;debug-session-id=&lt;sessionId&gt;</text>

  <!-- Platform debug server -->
  <rect x="566" y="176" width="210" height="56" rx="8" class="box"/>
  <rect x="566" y="184" width="3" height="40" rx="1.5" fill="var(--accent-server)"/>
  <text x="580" y="209" class="box-title">Platform debug server</text>

  <!-- Console API -->
  <rect x="566" y="300" width="210" height="64" rx="8" class="box"/>
  <rect x="566" y="308" width="3" height="48" rx="1.5" fill="var(--accent-api)"/>
  <text x="580" y="324" class="box-title">Console API</text>
  <text x="580" y="345" class="mono code">/actions/debug</text>
</svg>
