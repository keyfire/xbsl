                        Type: Checkbox
                        Kind: Switch
                        Title: Напоминать
                        Value: True
                    -
                        Type: Checkbox
                        Kind: CheckboxThreeState
                        Title: Частично
                        Value: Undefined
                    -
                        Type: Button
                        Kind: Additional
                        TitleDisplayKind: Icon
