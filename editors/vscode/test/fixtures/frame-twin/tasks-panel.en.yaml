                        WidthInColumns: Unlimited
            -
                Type: Group
                Layout: Carousel
                HorizontalAlignInGroup: Center
                Content:
                    -
                        Type: Label
                        Value: Слайд
            -
                Type: Group
                Layout: Matrix
                Content:
                    -
                        Type: Label
                        Value: Ячейка
            -
                Type: Group
                Layout: Bento
                Content:
                    -
                        Type: Label
                        Value: Блок
            -
                Type: Group
                Height: 120
                VerticalScroll: True
                Content:
                    -
                        Type: Label
                        Value: Прокручиваемая область
            -
                Type: Label
                Value: Не растягивается
                HorizontalStretch: False
            -
                Type: Label
                Value: Скрытая надпись
                Visible: False
            -
                Type: Group
                Enabled: False
                Content:
                    -
                        Type: Edit<String>
                        Title: Закрытое поле
                    -
                        Type: Edit<String>
                        Title: Открытое поле
                        Enabled: True
            -
                Type: UsualCommand
                Presentation: Обновить
