            -
                Type: Group
                Layout: ByColumns
                Content:
                    -
                        Type: Edit<String>
                        Title: Название
                        WidthInColumns: Double
                    -
                        Type: Edit<String>
                        Title: Код
                        WidthInColumns: Half
                    -
                        Type: Label
